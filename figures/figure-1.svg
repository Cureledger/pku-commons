<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#333"/>
</marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#999"/>
</marker>
</defs>

<line x1="360" y1="20" x2="360" y2="330" stroke="#ddd" stroke-width="1"/>

<rect x="55" y="40" width="250" height="132" fill="#eeeeee" stroke="#333" stroke-width="1.4"/>
<text x="180" y="64" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Contract research organisation</text>
<text x="180" y="88" font-size="11.5" text-anchor="middle" fill="#444">collects the evidence</text>
<text x="180" y="108" font-size="11.5" text-anchor="middle" fill="#444">attests it is sound</text>
<text x="180" y="128" font-size="11.5" text-anchor="middle" fill="#444">moves the money</text>
<text x="180" y="148" font-size="11.5" text-anchor="middle" fill="#444">holds the only record</text>

<line x1="150" y1="266" x2="150" y2="176" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
<text x="142" y="218" font-size="11" text-anchor="end" fill="#1a1a1a">data</text>
<text x="142" y="232" font-size="11" text-anchor="end" fill="#777">unpaid</text>

<line x1="215" y1="176" x2="215" y2="266" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="225" y="224" font-size="11" fill="#777">no view</text>

<rect x="120" y="268" width="120" height="40" fill="#fff" stroke="#333" stroke-width="1.4"/>
<text x="180" y="293" font-size="13" text-anchor="middle" fill="#1a1a1a">Alice</text>

<rect x="388" y="40" width="140" height="66" fill="#fff" stroke="#333" stroke-width="1.4"/>
<text x="458" y="66" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Trustee</text>
<text x="458" y="88" font-size="11.5" text-anchor="middle" fill="#444">data and duty</text>

<rect x="552" y="40" width="140" height="66" fill="#fff" stroke="#333" stroke-width="1.4"/>
<text x="622" y="66" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Servicer</text>
<text x="622" y="88" font-size="11.5" text-anchor="middle" fill="#444">work, no data</text>

<line x1="528" y1="73" x2="552" y2="73" stroke="#999" stroke-width="1.2" marker-end="url(#ag)"/>

<rect x="388" y="148" width="304" height="34" fill="#eeeeee" stroke="#333" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="540" y="170" font-size="12" text-anchor="middle" fill="#1a1a1a">receipts, readable by every party</text>

<line x1="458" y1="106" x2="458" y2="146" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="622" y1="106" x2="622" y2="146" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>

<line x1="500" y1="266" x2="500" y2="186" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
<text x="492" y="230" font-size="11" text-anchor="end" fill="#1a1a1a">data</text>

<line x1="580" y1="186" x2="580" y2="266" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
<text x="590" y="223" font-size="11" fill="#1a1a1a">verify</text>
<text x="590" y="237" font-size="11" fill="#1a1a1a">and return</text>

<rect x="480" y="268" width="120" height="40" fill="#fff" stroke="#333" stroke-width="1.4"/>
<text x="540" y="293" font-size="13" text-anchor="middle" fill="#1a1a1a">Alice</text>
</svg>
